name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  light:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint
      - run: make unit-test
      - run: make licenses-check

  heavy-1:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Install krew
        run: |
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_amd64.tar.gz"
          tar zxf krew-linux_amd64.tar.gz
          ./krew-linux_amd64 install krew
          echo "${HOME}/.krew/bin" >> "$GITHUB_PATH"
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0, kind v0.31.0, kubectl v1.35.0
        with:
          cluster_name: vifal-test
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
      - run: make e2e-test-shell
        env:
          VIFAL_E2E_KREW: "1"
      # With race detector and no attr caching.
      - run: FUSE_TIMEOUT=5 make e2e-test-shell-nocache
        env:
          GO_BUILD_FLAGS: -race

  heavy-2:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0, kind v0.31.0, kubectl v1.35.0
        with:
          cluster_name: vifal-test
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
      - run: make e2e-test-go
      # 100ms one-way delay on the kind container, "kind" of simulates a remote cluster.
      - name: Shell tests with 100ms network latency
        run: |
          docker exec vifal-test-control-plane tc qdisc add dev eth0 root netem delay 100ms 5ms
          FUSE_TIMEOUT=5 make e2e-test-shell || { docker exec vifal-test-control-plane tc qdisc del dev eth0 root 2>/dev/null; exit 1; }
          docker exec vifal-test-control-plane tc qdisc del dev eth0 root
